<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141418">
<title>{% block title %}Holo{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Holo">
</head>
<body>
<div id="nprog"></div>
<div id="beta" class="beta" hidden>
  <b>Beta</b> — rough edges expected. Prices update daily.
  <a href="/profile#feedback">Report a bug</a>
  <button id="beta-x" aria-label="Dismiss">&times;</button>
</div>
<main class="shell">
{% block body %}{% endblock %}
</main>
{% if page %}
<nav class="tabs" aria-label="Sections">
  <a href="/" class="{{ 'on' if page=='portfolio' }}">
    <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 5"/></svg><span>Portfolio</span></a>
  <a href="/cards" class="{{ 'on' if page=='cards' }}">
    <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 8h8M8 12h5"/></svg><span>Cards</span></a>
  <a href="/add" class="{{ 'on' if page=='add' }} plus" aria-label="Add card">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a>
  <a href="/movers" class="{{ 'on' if page=='movers' }}">
    <svg viewBox="0 0 24 24"><path d="M4 14l6-6 4 4 6-6"/><path d="M14 6h6v6"/></svg><span>Movers</span></a>
  <a href="/profile" class="{{ 'on' if page=='profile' }}">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>You</span></a>
</nav>
{% endif %}
<div id="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='nav.js') }}" defer></script>
<script src="{{ url_for('static', filename='craft.js') }}" defer></script>
<script>
(() => {
  const b = document.getElementById('beta');
  if (!localStorage.getItem('beta-hidden')) b.hidden = false;
  document.getElementById('beta-x').onclick = () => {
    b.hidden = true; localStorage.setItem('beta-hidden', '1');
  };
})();
</script>
{% block script %}{% endblock %}
</body>
</html>
